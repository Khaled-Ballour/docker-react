sudo: required
services:
  - docker
brfore_install:
  - docker build -t ballour/docker-react -f Dockerfile.dev
script:
  - docker run -e CI=true ballour/docker-react npm run test

deploy:
  provider: elasticbeanstalk
  region: "eu-west-1"
  app: "frontend"
  env: "Fronend-env"
  bucket_name: "elasticbeanstalk-eu-west-1-761018880036"
  bucket_path: "frontend"
  on:
    branch: master
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: "$AWS_SECRET_KEY"
